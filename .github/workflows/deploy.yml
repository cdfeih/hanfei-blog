name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 站点地址：优先使用仓库变量 SITE_URL；否则按 GITHUB_REPOSITORY 推导
      # （owner/owner.github.io → 根路径；owner/repo → /repo/ 子路径）
      # 注意：必须在 astro check 之前执行——CI 上配置文件会校验 SITE_URL 是否存在。
      - name: Resolve site URL and base path
        id: site
        env:
          REPO: ${{ github.repository }}
          VAR_SITE_URL: ${{ vars.SITE_URL }}
          VAR_BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          name="${REPO##*/}"
          if [ -n "${VAR_SITE_URL}" ]; then
            SITE_URL="$VAR_SITE_URL"
            BASE_PATH="${VAR_BASE_PATH:-}"
          elif [ "${name}" = "${owner}.github.io" ]; then
            SITE_URL="https://${owner}.github.io"
            BASE_PATH="/"
          else
            SITE_URL="https://${owner}.github.io/${name}"
            BASE_PATH="/${name}"
          fi
          echo "SITE_URL=${SITE_URL}" >> "$GITHUB_ENV"
          echo "BASE_PATH=${BASE_PATH}" >> "$GITHUB_ENV"
          echo "使用站点地址：${SITE_URL}，base：${BASE_PATH}"

      - name: Type & content check
        run: pnpm exec astro check

      - name: Build (Astro + Pagefind)
        run: |
          pnpm build
          pnpm exec pagefind --site dist

      - name: Verify dist
        env:
          BASE_PATH: ${{ env.BASE_PATH }}
          STRICT_SITE: '1'
        run: pnpm verify

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
