<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">MCP 与内置助手共享领域执行链</title>
  <desc id="desc">外部客户端通过 HTTP 认证、内置助手通过可信桥，汇合到统一工具执行器，再进入项目工具和正式业务服务。身份与工作区由宿主绑定。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3152a3"/></marker></defs>
  <rect width="960" height="520" rx="18" fill="#f5f7fb"/>
  <g font-family="'Microsoft YaHei',sans-serif" text-anchor="middle">
    <text x="480" y="44" font-size="24" font-weight="700" fill="#152643">两条入口，一套领域规则</text>
    <g fill="#fff" stroke="#c2cee3" stroke-width="2">
      <rect x="55" y="82" width="390" height="62" rx="9"/>
      <rect x="515" y="82" width="390" height="62" rx="9"/>
      <rect x="55" y="180" width="390" height="70" rx="9"/>
      <rect x="515" y="180" width="390" height="70" rx="9"/>
      <rect x="250" y="298" width="460" height="72" rx="9" fill="#e9efff" stroke="#3152a3"/>
      <rect x="250" y="411" width="460" height="64" rx="9"/>
    </g>
    <g fill="#152643" font-size="20">
      <text x="250" y="120">外部 MCP 客户端</text>
      <text x="710" y="120">内置建模助手</text>
      <text x="250" y="210">HTTP 身份认证</text>
      <text x="710" y="210">AiAssistantToolBridge</text>
      <text x="480" y="328">McpToolExecutor</text>
      <text x="480" y="449">项目工具 → 正式业务服务</text>
    </g>
    <g fill="#526581" font-size="15">
      <text x="250" y="234">个人凭证 → 可信传输上下文</text>
      <text x="710" y="234">绑定身份、工作区、请求号、确认状态</text>
      <text x="480" y="352">严格入参 · 再次授权 · 作用域 · 回执</text>
      <text x="480" y="502">工具调用最终遵循版本、数据锁、领域语义与事务规则</text>
    </g>
  </g>
  <g fill="none" stroke="#3152a3" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M250 144V174"/><path d="M710 144V174"/>
    <path d="M250 250V275H380V291"/><path d="M710 250V275H580V291"/>
    <path d="M480 370V403"/>
  </g>
</svg>
